[package]
name = "craft-captions"
description = "Caption and subtitle files behind one neutral model: SubRip, WebVTT, Scenarist SCC, MacCaption MCC, EBU STL and TTML/IMSC1/DFXP readers and writers with exact time, and CEA-608/708 coding"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"


[features]
default = []
# MP4 timed text (3GPP TS 26.245 / mov_text / tx3g) sample codec.
mov-text = []

[dependencies]
craft-timeline = { path = "../timeline" }
craft-xml = { path = "../xml" }
thiserror = "2"

