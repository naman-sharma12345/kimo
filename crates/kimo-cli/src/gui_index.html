<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>kimo gui (v7, minimal)</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #1b1b1f; color: #eee; }
  header { padding: 10px 16px; background: #222; border-bottom: 1px solid #333; }
  main { display: grid; grid-template-columns: 1fr 360px; gap: 12px; padding: 12px; }
  section { background: #222; border: 1px solid #333; border-radius: 6px; padding: 10px; }
  h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #9ab; }
  #timeline { overflow-x: auto; }
  .track { display: flex; align-items: center; height: 28px; border-bottom: 1px solid #2c2c33; }
  .track-label { width: 70px; font-size: 11px; color: #889; flex: none; }
  .clip { position: relative; height: 20px; background: #3a6; border-radius: 3px; margin-right: 1px; font-size: 10px; color: #012; padding: 2px 4px; overflow: hidden; white-space: nowrap; flex: none; }
  #preview img { max-width: 100%; border: 1px solid #333; background: #000; display: block; }
  #preview input { width: 70px; }
  textarea { width: 100%; box-sizing: border-box; background: #111; color: #cfc; border: 1px solid #333; font-family: monospace; font-size: 12px; }
  button { background: #357; color: #fff; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  #tool-list { max-height: 160px; overflow-y: auto; font-size: 11px; }
  #tool-list div { padding: 2px 0; cursor: pointer; color: #9cf; }
  #result { white-space: pre-wrap; font-family: monospace; font-size: 11px; background: #111; padding: 6px; border-radius: 4px; max-height: 220px; overflow: auto; }
  .clip.selected { outline: 2px solid #fd6; }
  .clip { cursor: grab; }
  .clip:active { cursor: grabbing; }
  .clip .trim-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; background: rgba(255,255,255,.25); }
  #tracks { position: relative; cursor: text; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: #f55; z-index: 5; pointer-events: none; }
  .marker-tick { position: absolute; top: 0; bottom: 0; width: 2px; z-index: 4; cursor: pointer; }
  #inspector .fx { border: 1px solid #333; border-radius: 4px; padding: 6px; margin-bottom: 6px; }
  #inspector .fx-head { display: flex; justify-content: space-between; font-size: 11px; color: #9cf; margin-bottom: 4px; }
  #inspector .param-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin: 2px 0; }
  #inspector .param-row input { width: 90px; }
  #inspector .prop-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin: 2px 0; }
  #inspector .prop-row input { width: 90px; }
  #inspector select, #inspector button.small { font-size: 11px; padding: 3px 6px; }
  #no-selection { font-size: 11px; color: #778; }
  #history-list { max-height: 120px; overflow-y: auto; font-size: 11px; }
  #history-list .step { padding: 1px 0; color: #9ab; }
  #history-list .step.next-undo { color: #fd6; font-weight: bold; }
  #history-list .step.redo { color: #6a9; }
</style>
</head>
<body>
<header><strong>kimo</strong> &middot; v7 minimal GUI over the MCP registry
  <span style="float:right;font-size:12px">
    <input id="project-path" placeholder="project.json" style="width:220px">
    <button class="small" style="font-size:11px;padding:3px 8px" onclick="saveProject()">Save</button>
    <button class="small" style="font-size:11px;padding:3px 8px" onclick="openProject()">Open</button>
    <span id="project-status" style="color:#9ab;margin-left:6px"></span>
  </span>
</header>
<main>
  <div>
    <section id="preview">
      <h2>Preview frame</h2>
      <div><label>t = <input id="t" type="number" step="0.1" value="0" onchange="scrubTo(parseFloat(this.value))"> s <button onclick="loadPreview()">Render</button> <button id="play-btn" onclick="togglePlay()">Play</button></label></div>
      <img id="frame" alt="(no frame rendered yet)">
    </section>
    <section id="timeline" style="margin-top:12px">
      <h2>Timeline <button class="small" style="font-size:11px;padding:2px 6px" onclick="addTrack()">+ Track</button> <button class="small" style="font-size:11px;padding:2px 6px" onclick="addMarkerAtPlayhead()">+ Marker</button> <label style="font-size:11px;font-weight:normal;text-transform:none;letter-spacing:normal;color:#9ab"><input type="checkbox" id="snap-enabled" checked style="vertical-align:middle"> snap</label> <button class="small" style="font-size:11px;padding:2px 6px" onclick="zoomBy(0.5)">−</button> <span id="zoom-label" style="font-size:11px;color:#9ab">40px/s</span> <button class="small" style="font-size:11px;padding:2px 6px" onclick="zoomBy(2)">+</button> <button class="small" style="font-size:11px;padding:2px 6px" onclick="zoomReset()">reset</button></h2>
      <div id="tracks"></div>
    </section>
    <section id="inspector" style="margin-top:12px">
      <h2>Clip &middot; effect params</h2>
      <div id="no-selection">Click a clip on the timeline to inspect it.</div>
      <div id="inspector-body" style="display:none">
        <div style="font-size:12px;margin-bottom:6px"><strong id="insp-name"></strong> <span id="insp-timing" style="color:#889"></span></div>
        <div id="insp-props"></div>
        <div id="insp-effects"></div>
        <div style="margin-top:6px">
          <select id="insp-add-effect-kind"></select>
          <button class="small" onclick="addEffectToSelected()">Add effect</button>
        </div>
      </div>
    </section>
    <section id="history" style="margin-top:12px">
      <h2>History</h2>
      <div><button onclick="doUndo()" id="undo-btn">Undo</button> <button onclick="doRedo()" id="redo-btn">Redo</button></div>
      <div id="history-list" style="margin-top:6px"></div>
    </section>
    <section id="export" style="margin-top:12px">
      <h2>Export</h2>
      <div><input id="export-path" value="export.mp4" style="width:65%"> <button id="export-btn" onclick="startExport()">Export</button> <button id="export-cancel-btn" onclick="cancelExport()" style="display:none;background:#733">Cancel</button></div>
      <div id="export-bar-outer" style="display:none;margin-top:6px;background:#111;border-radius:4px;height:10px;overflow:hidden"><div id="export-bar-inner" style="background:#5a8;height:100%;width:0%"></div></div>
      <div id="export-status" style="font-size:11px;color:#9ab;margin-top:4px"></div>
    </section>
  </div>
  <section>
    <h2>Tools</h2>
    <input id="search" placeholder="filter tools..." style="width:100%;box-sizing:border-box" oninput="filterTools()">
    <div id="tool-list"></div>
    <h2 style="margin-top:10px">Invoke</h2>
    <div><input id="tool-name" placeholder="tool name" style="width:100%;box-sizing:border-box"></div>
    <textarea id="tool-args" rows="4">{}</textarea>
    <button onclick="callTool()">Run</button>
    <h2 style="margin-top:10px">Result</h2>
    <div id="result"></div>
  </section>
</main>
<script src="/gui_keymap.js"></script>
<script src="/gui_snap.js"></script>
<script src="/gui_zoom.js"></script>
<script>
let registry = [];
let projectFps = 30; // set from /api/timeline; used by J/K/L's frame step
let effectCatalog = [];
let selectedClipId = null;
let pxPerSec = (window.kimoZoom ? window.kimoZoom.DEFAULT_PX_PER_SEC : 40); // v7.3: mutable for zoom in/out (bounds live in gui_zoom.js)
const labelWidth = 70; // matches .track-label's CSS width
let projectDuration = 0;
let currentT = 0;
let playing = false; let playTimer = null; let playLastWall = 0;

async function loadTimeline() {
  const r = await fetch('/api/timeline'); const tl = await r.json();
  lastTimeline = tl; // cached for snapProposed() -- a drag's candidates need no mid-drag API call
  projectDuration = tl.duration;
  if (tl.fps) projectFps = tl.fps;
  const el = document.getElementById('tracks'); el.innerHTML = '';
  el.onmousedown = (ev) => { if (!ev.target.closest('.clip')) scrubToPixel(ev.clientX, el); };
  for (const t of tl.tracks) {
    const row = document.createElement('div'); row.className = 'track'; row.style.position = 'relative';
    const label = document.createElement('div'); label.className = 'track-label'; label.style.display = 'flex'; label.style.justifyContent = 'space-between'; label.style.alignItems = 'center';
    const labelText = document.createElement('span'); labelText.textContent = t.name || t.id; label.appendChild(labelText);
    const removeBtn = document.createElement('span'); removeBtn.textContent = '\u00d7'; removeBtn.title = 'remove this track and all its clips';
    removeBtn.style.cursor = 'pointer'; removeBtn.style.color = '#f77'; removeBtn.style.padding = '0 4px';
    removeBtn.onclick = (ev) => { ev.stopPropagation(); removeTrack(t.id); };
    label.appendChild(removeBtn); row.appendChild(label);
    const lane = document.createElement('div'); lane.style.position = 'relative'; lane.style.height = '20px'; lane.style.flex = '1 1 auto';
    for (const c of t.clips) {
      const bar = document.createElement('div'); bar.className = 'clip' + (c.id === selectedClipId ? ' selected' : '');
      bar.style.position = 'absolute'; bar.style.left = (c.start * pxPerSec) + 'px';
      bar.style.width = Math.max(4, c.duration * pxPerSec) + 'px';
      bar.title = (c.name || c.id) + ' (' + c.source_kind + ') ' + c.start.toFixed(2) + 's..' + c.end.toFixed(2) + 's -- drag to move, drag the right edge to trim, click to inspect';
      bar.textContent = c.name || c.source_kind;
      bar.dataset.clipId = c.id;
      const handle = document.createElement('div'); handle.className = 'trim-handle';
      handle.onmousedown = (ev) => startDrag(ev, c, 'trim');
      bar.appendChild(handle);
      bar.onmousedown = (ev) => { if (ev.target === handle) return; startDrag(ev, c, 'move'); };
      bar.onclick = () => { if (!justDragged) selectClip(c.id); };
      lane.appendChild(bar);
    }
    row.appendChild(lane);
    el.appendChild(row);
  }
  for (const m of (tl.markers || [])) {
    const tick = document.createElement('div'); tick.className = 'marker-tick';
    tick.style.left = (labelWidth + m.time * pxPerSec) + 'px';
    tick.style.background = m.color || 'gold';
    tick.title = (m.name || '(marker)') + ' @ ' + m.time.toFixed(2) + 's -- click to remove';
    tick.onclick = (ev) => { ev.stopPropagation(); removeMarkerAt(m.id); };
    el.appendChild(tick);
  }
  const ph = document.createElement('div'); ph.id = 'playhead'; ph.style.left = (labelWidth + currentT * pxPerSec) + 'px'; ph.style.pointerEvents = 'none';
  el.appendChild(ph);
  loadHistory();
}

async function loadHistory() {
  const v = await callApi('history_list', {});
  if (!v.ok) return;
  const h = v.result;
  const el = document.getElementById('history-list'); el.innerHTML = '';
  for (const step of h.undo) {
    const d = document.createElement('div'); d.className = 'step' + (step.step === h.undo.length - 1 ? ' next-undo' : '');
    d.textContent = step.tool; el.appendChild(d);
  }
  for (const label of h.redo) { const d = document.createElement('div'); d.className = 'step redo'; d.textContent = '\u21bb ' + label; el.appendChild(d); }
  if (h.undo.length === 0 && h.redo.length === 0) el.innerHTML = '<div style="color:#667">(nothing yet)</div>';
  document.getElementById('undo-btn').disabled = h.undo.length === 0;
  document.getElementById('redo-btn').disabled = h.redo.length === 0;
}
async function zoomBy(factor) {
  pxPerSec = window.kimoZoom.zoomBy(pxPerSec, factor);
  const lbl = document.getElementById('zoom-label'); if (lbl) lbl.textContent = pxPerSec + 'px/s';
  await loadTimeline();
}
async function zoomReset() {
  pxPerSec = window.kimoZoom.DEFAULT_PX_PER_SEC;
  const lbl = document.getElementById('zoom-label'); if (lbl) lbl.textContent = pxPerSec + 'px/s';
  await loadTimeline();
}
// v7.3: export with progress -- export_job_start/job_status/cancel_job already exist in kimo-core
// (chunked export, incremental reuse, ETA); this just polls and renders what they already report.
let exportJobId = null; let exportPollTimer = null;
function exportStatusLine(s) {
  const parts = [s.state];
  if (s.chunks) parts.push(`${s.chunks.done}/${s.chunks.total} chunks`);
  if (s.eta && s.eta.seconds != null) parts.push(`~${Math.ceil(s.eta.seconds)}s left (${s.eta.uncertainty})`);
  if (s.error) parts.push(`error: ${s.error}`);
  return parts.join(' · ');
}
function renderExportStatus(s) {
  const outer = document.getElementById('export-bar-outer'); const inner = document.getElementById('export-bar-inner');
  const status = document.getElementById('export-status'); const cancelBtn = document.getElementById('export-cancel-btn'); const btn = document.getElementById('export-btn');
  outer.style.display = 'block';
  const pct = (s.chunks && s.chunks.total > 0) ? Math.round(100 * s.chunks.done / s.chunks.total) : (s.frames_total > 0 ? Math.round(100 * s.frames_done / s.frames_total) : 0);
  inner.style.width = pct + '%';
  status.textContent = exportStatusLine(s);
  const active = s.state === 'running' || s.state === 'queued' || s.state === 'cancelling';
  cancelBtn.style.display = active ? 'inline-block' : 'none';
  btn.disabled = active;
}
async function startExport() {
  const path = document.getElementById('export-path').value.trim() || 'export.mp4';
  const r = await callApi('export_job_start', { path, wait: false });
  if (!r.ok) { document.getElementById('export-status').textContent = 'could not start: ' + (typeof r.error === 'string' ? r.error : JSON.stringify(r.error)); return; }
  exportJobId = r.result.job_id;
  renderExportStatus({ state: 'queued', chunks: { done: 0, total: 0 } });
  if (exportPollTimer) clearInterval(exportPollTimer);
  exportPollTimer = setInterval(pollExportJob, 500);
  await pollExportJob();
}
async function pollExportJob() {
  if (!exportJobId) return;
  const r = await callApi('job_status', { job_id: exportJobId });
  if (!r.ok) { clearInterval(exportPollTimer); exportPollTimer = null; return; }
  renderExportStatus(r.result);
  if (['done', 'failed', 'cancelled'].includes(r.result.state)) { clearInterval(exportPollTimer); exportPollTimer = null; }
}
async function cancelExport() {
  if (!exportJobId) return;
  await callApi('cancel_job', { job_id: exportJobId });
  await pollExportJob();
}
// v7.3: project open/save -- save_project/load_project already exist in kimo-core (atomic write with a
// temp+rename, optional with_history); this just wires the existing path field + buttons onto them.
async function saveProject() {
  const path = document.getElementById('project-path').value.trim();
  const status = document.getElementById('project-status');
  if (!path) { status.textContent = 'enter a path first'; return; }
  const r = await callApi('save_project', { path });
  status.textContent = r.ok ? `saved ${path}` : ('could not save: ' + (typeof r.error === 'string' ? r.error : JSON.stringify(r.error)));
}
async function openProject() {
  const path = document.getElementById('project-path').value.trim();
  const status = document.getElementById('project-status');
  if (!path) { status.textContent = 'enter a path first'; return; }
  const r = await callApi('load_project', { path });
  if (!r.ok) { status.textContent = 'could not open: ' + (typeof r.error === 'string' ? r.error : JSON.stringify(r.error)); return; }
  status.textContent = `opened ${path}`;
  selectedClipId = null;
  document.getElementById('inspector-body').style.display = 'none';
  document.getElementById('no-selection').style.display = 'block';
  await loadTimeline();
  await loadHistory();
}
async function addTrack() { await callApi('add_track', {}); await loadTimeline(); }
async function addMarkerAtPlayhead() {
  const name = (typeof prompt === 'function' ? prompt('Marker name (optional):', '') : '') || '';
  const v = await callApi('add_marker', { time: currentT, name });
  if (!v.ok) { alert(typeof v.error === 'string' ? v.error : 'could not add a marker'); return; }
  await loadTimeline();
}
async function removeMarkerAt(markerId) {
  if (!confirm('Remove this marker?')) return;
  const v = await callApi('remove_marker', { marker_id: markerId });
  if (!v.ok) { alert(typeof v.error === 'string' ? v.error : 'could not remove that marker'); return; }
  await loadTimeline();
}
async function removeTrack(trackId) {
  if (!confirm('Remove this track and all its clips?')) return;
  const v = await callApi('delete_track', { track_id: trackId });
  if (!v.ok) { alert(typeof v.error === 'string' ? v.error : 'could not remove that track'); return; }
  if (selectedClipId) { selectedClipId = null; await loadInspector(); } // the selected clip may have lived on this track
  await loadTimeline();
}
async function doUndo() { const v = await callApi('undo', {}); if (!v.ok) { alert(v.error && v.error.message || 'nothing to undo'); return; } await loadTimeline(); if (selectedClipId) await loadInspector(); }
async function doRedo() { const v = await callApi('redo', {}); if (!v.ok) { alert(v.error && v.error.message || 'nothing to redo'); return; } await loadTimeline(); if (selectedClipId) await loadInspector(); }

function scrubToPixel(clientX, tracksEl) {
  const rect = tracksEl.getBoundingClientRect();
  const t = Math.max(0, Math.min(projectDuration, (clientX - rect.left - labelWidth) / pxPerSec));
  scrubTo(t);
}
function scrubTo(t) {
  currentT = Math.max(0, t);
  document.getElementById('t').value = currentT.toFixed(2);
  const ph = document.getElementById('playhead'); if (ph) ph.style.left = (labelWidth + currentT * pxPerSec) + 'px';
  loadPreview();
}
function togglePlay() {
  if (playing) { playing = false; clearInterval(playTimer); document.getElementById('play-btn').textContent = 'Play'; return; }
  playing = true; document.getElementById('play-btn').textContent = 'Pause'; playLastWall = performance.now();
  playTimer = setInterval(() => {
    const now = performance.now(); const dt = (now - playLastWall) / 1000; playLastWall = now;
    let t = currentT + dt;
    if (t >= projectDuration) { t = projectDuration; playing = false; clearInterval(playTimer); document.getElementById('play-btn').textContent = 'Play'; }
    scrubTo(t);
  }, 150); // frame-stepped preview (one still image per tick), not continuous video playback
}

function stepFrame(dir) {
  if (playing) togglePlay();
  const frame = 1 / (projectFps || 30);
  scrubTo(currentT + dir * frame);
}

async function deleteSelectedClip() {
  if (!selectedClipId) return;
  const id = selectedClipId;
  const v = await callApi('delete_clip', { clip_id: id });
  if (!v.ok) { alert(typeof v.error === 'string' ? v.error : 'could not delete that clip'); return; }
  selectedClipId = null;
  await loadTimeline(); await loadInspector();
}

async function splitAtPlayhead() {
  if (!selectedClipId) return; // nothing selected: no clip to split
  const v = await callApi('split_clip', { clip_id: selectedClipId, at: currentT });
  if (!v.ok) { alert(typeof v.error === 'string' ? v.error : 'cannot split here (playhead must be strictly inside the selected clip)'); return; }
  await loadTimeline(); await loadInspector();
}

// v7.3 keyboard shortcuts: space play/pause, J/K/L shuttle (step back / pause / step forward -- this is a
// frame-stepped preview, not continuous video playback, so J/L step one frame rather than shuttling at
// speed), Delete removes the selected clip, S splits it at the playhead, Ctrl/Cmd+Z undoes, +Shift redoes.
// The mapping itself lives in gui_keymap.js (one pure function, unit-tested headless under Node); this
// listener is just the DOM glue that calls it and dispatches on its answer.
document.addEventListener('keydown', (ev) => {
  const action = window.kimoKeymap && window.kimoKeymap.resolveKeyAction(ev);
  if (!action) return;
  ev.preventDefault();
  if (action === 'play_pause') togglePlay();
  else if (action === 'pause') { if (playing) togglePlay(); }
  else if (action === 'step_back') stepFrame(-1);
  else if (action === 'step_forward') stepFrame(1);
  else if (action === 'delete_clip') deleteSelectedClip();
  else if (action === 'split_at_playhead') splitAtPlayhead();
  else if (action === 'undo') doUndo();
  else if (action === 'redo') doRedo();
});

let justDragged = false;
let lastTimeline = null; // cached from the most recent loadTimeline(), so a drag's snap candidates need no mid-drag API call
const SNAP_PX = 8; // pixel tolerance for snapping, converted to seconds via pxPerSec (matches the drag's own units)
function snapEnabled() { const el = document.getElementById('snap-enabled'); return !el || el.checked; }
function snapProposed(proposed, excludeClipId) {
  if (!snapEnabled() || !window.kimoSnap || !lastTimeline) return proposed;
  const candidates = window.kimoSnap.candidatesFromTimeline(lastTimeline, excludeClipId);
  return window.kimoSnap.snapTime(proposed, candidates, SNAP_PX / pxPerSec);
}
function startDrag(ev, clip, mode) {
  ev.preventDefault(); ev.stopPropagation();
  const startX = ev.clientX; const origStart = clip.start; const origDuration = clip.duration;
  justDragged = false;
  function onMove(mv) {
    const deltaSec = (mv.clientX - startX) / pxPerSec;
    if (Math.abs(mv.clientX - startX) > 3) justDragged = true;
    const bar = document.querySelector(`.clip[data-clip-id="${CSS.escape(clip.id)}"]`); if (!bar) return;
    if (mode === 'move') {
      const snapped = snapProposed(Math.max(0, origStart + deltaSec), clip.id);
      bar.style.left = snapped * pxPerSec + 'px';
    } else {
      const proposedEnd = snapProposed(origStart + Math.max(0.04, origDuration + deltaSec), clip.id);
      bar.style.width = Math.max(4, (proposedEnd - origStart) * pxPerSec) + 'px';
    }
  }
  async function onUp(up) {
    document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
    const deltaSec = (up.clientX - startX) / pxPerSec;
    if (Math.abs(up.clientX - startX) <= 3) return; // a click, not a drag: selectClip's onclick handles it
    if (mode === 'move') {
      const snapped = snapProposed(Math.max(0, origStart + deltaSec), clip.id);
      await callApi('move_clip', { clip_id: clip.id, start: snapped });
    } else {
      const snappedEnd = snapProposed(origStart + Math.max(0.04, origDuration + deltaSec), clip.id);
      await callApi('trim_clip', { clip_id: clip.id, duration: Math.max(0.04, snappedEnd - origStart) });
    }
    await loadTimeline(); if (selectedClipId === clip.id) await loadInspector();
    setTimeout(() => { justDragged = false; }, 0);
  }
  document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
}

async function selectClip(id) {
  selectedClipId = id;
  document.querySelectorAll('.clip').forEach(el => el.classList.toggle('selected', el.dataset.clipId === id));
  await loadInspector();
}

async function loadEffectCatalog() {
  if (effectCatalog.length) return;
  const r = await fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool: 'list_effects', args: {} }) });
  const v = await r.json();
  if (v.ok) { effectCatalog = v.result; const sel = document.getElementById('insp-add-effect-kind'); sel.innerHTML = effectCatalog.map(e => `<option value="${e.kind}">${e.kind}</option>`).join(''); }
}

async function loadInspector() {
  if (!selectedClipId) { document.getElementById('no-selection').style.display = ''; document.getElementById('inspector-body').style.display = 'none'; return; }
  await loadEffectCatalog();
  const r = await fetch('/api/clip?id=' + encodeURIComponent(selectedClipId));
  if (!r.ok) { selectedClipId = null; document.getElementById('no-selection').textContent = 'that clip is gone.'; document.getElementById('no-selection').style.display = ''; document.getElementById('inspector-body').style.display = 'none'; return; }
  const c = await r.json();
  document.getElementById('no-selection').style.display = 'none';
  document.getElementById('inspector-body').style.display = '';
  document.getElementById('insp-name').textContent = c.name || c.id;
  document.getElementById('insp-timing').textContent = c.start.toFixed(2) + 's .. ' + c.end.toFixed(2) + 's (' + c.source_kind + ')';

  const propsEl = document.getElementById('insp-props'); propsEl.innerHTML = '<div style="font-size:11px;color:#9ab;margin:4px 0">properties</div>';
  for (const [name, value] of Object.entries(c.props)) {
    const row = document.createElement('div'); row.className = 'prop-row';
    row.innerHTML = `<span>${name}</span>`;
    const input = document.createElement('input'); input.type = 'number'; input.step = 'any'; input.value = value;
    input.onchange = () => setProperty(c.id, name, parseFloat(input.value));
    row.appendChild(input); propsEl.appendChild(row);
  }

  const fxEl = document.getElementById('insp-effects'); fxEl.innerHTML = '<div style="font-size:11px;color:#9ab;margin:4px 0">effects (in order)</div>';
  for (const fx of c.effects) {
    const box = document.createElement('div'); box.className = 'fx';
    const head = document.createElement('div'); head.className = 'fx-head';
    head.innerHTML = `<span>${fx.kind}</span>`;
    const rm = document.createElement('button'); rm.className = 'small'; rm.textContent = 'remove'; rm.onclick = () => removeEffect(c.id, fx.id);
    head.appendChild(rm); box.appendChild(head);
    for (const [pname, pval] of Object.entries(fx.params)) {
      const row = document.createElement('div'); row.className = 'param-row';
      row.innerHTML = `<span>${pname}</span>`;
      const input = document.createElement('input'); input.type = 'number'; input.step = 'any'; input.value = pval;
      input.onchange = () => setEffectParam(c.id, fx.id, pname, parseFloat(input.value));
      row.appendChild(input); box.appendChild(row);
    }
    fxEl.appendChild(box);
  }
}

async function callApi(tool, args) {
  const r = await fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool, args }) });
  return r.json();
}
async function setProperty(clipId, property, value) { await callApi('set_property', { clip_id: clipId, property, value }); loadInspector(); loadTimeline(); }
async function setEffectParam(clipId, effectId, param, value) { await callApi('set_effect_param', { clip_id: clipId, effect_id: effectId, param, value }); loadInspector(); }
async function removeEffect(clipId, effectId) { await callApi('remove_effect', { clip_id: clipId, effect_id: effectId }); loadInspector(); }
async function addEffectToSelected() {
  if (!selectedClipId) return;
  const kind = document.getElementById('insp-add-effect-kind').value;
  await callApi('add_effect', { clip_id: selectedClipId, kind, params: {} });
  loadInspector();
}
async function loadPreview() {
  const t = document.getElementById('t').value;
  currentT = parseFloat(t) || 0;
  const ph = document.getElementById('playhead'); if (ph) ph.style.left = (labelWidth + currentT * pxPerSec) + 'px';
  document.getElementById('frame').src = '/preview.png?t=' + encodeURIComponent(t) + '&_=' + Date.now();
}
async function loadRegistry() {
  const r = await fetch('/api/registry'); registry = await r.json(); renderToolList(registry);
}
function renderToolList(list) {
  const el = document.getElementById('tool-list'); el.innerHTML = '';
  for (const c of list) {
    const d = document.createElement('div'); d.textContent = c.name + (c.mutates ? ' *' : '');
    d.title = c.summary; d.onclick = () => { document.getElementById('tool-name').value = c.name; };
    el.appendChild(d);
  }
}
function filterTools() {
  const q = document.getElementById('search').value.toLowerCase();
  renderToolList(registry.filter(c => c.name.toLowerCase().includes(q) || c.summary.toLowerCase().includes(q)));
}
async function callTool() {
  const tool = document.getElementById('tool-name').value.trim();
  let args; try { args = JSON.parse(document.getElementById('tool-args').value || '{}'); } catch (e) { document.getElementById('result').textContent = 'bad JSON in args: ' + e; return; }
  const r = await fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool, args }) });
  const v = await r.json();
  document.getElementById('result').textContent = JSON.stringify(v, null, 2);
  loadTimeline();
}
loadTimeline(); loadRegistry();
</script>
