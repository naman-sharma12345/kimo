[package]
name = "kimo-gui"
version = "9.0.0"
edition = "2021"
license = "MIT"
description = "kimo desktop app: video editor with the kimo engine, Claude Code / Codex / Antigravity on your own subscription, and a live view of every agent edit"

# Deliberately its own workspace: keeps the Tauri dependency tree out of the
# root workspace (core gate, integration suites, and the 38-warning baseline
# are untouched). Cargo.lock is NOT committed until the MPL-2.0 audit decision.
[workspace]

[lib]
name = "kimo_gui"
path = "src/lib.rs"

[[bin]]
name = "kimo-gui"
path = "src/main.rs"

[features]
# `tauri build` turns this on; a plain `cargo build` is the dev shell.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
# native Open / Save dialogs (import media, open/save project, export path), called from Rust only
tauri-plugin-dialog = "2"
# one kimo per user: a second launch focuses the open window (one engine, one project, one bridge)
tauri-plugin-single-instance = "2"
# in-app updates from GitHub releases (signed manifest `latest.json`; checked only in release builds, installed only on the user's click)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# provider calls (BYO key) and first-run downloads: blocking, rustls, no OpenSSL
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# OS credential store for "remember on this computer" (Windows Credential Manager / macOS Keychain / Secret Service)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
strip = true

# The shipping profile for installers (`tauri build -- --profile dist` / `cargo build --profile dist`): smallest binary.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }
