[package]
name = "kimo-gui"
version = "6.0.0"
edition = "2021"
license = "MIT"
description = "Kimo spectator: read-only live view of engine tool execution (Tauri v2 shell)"

# Deliberately its own workspace: keeps the Tauri dependency tree out of the
# root workspace (core gate, integration suites, and the 38-warning baseline
# are untouched). Cargo.lock is NOT committed until the MPL-2.0 audit decision.
[workspace]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
