<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kimo · spectator</title>
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="design.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <span class="logo" role="img" aria-label="kimo"><svg viewBox="0 0 1024 1024" aria-hidden="true"><use href="kimo-mark.svg#kimo-mark-sm"/></svg></span><span class="brand">kimo</span><span class="slash">/</span><span class="proj" id="proj">—</span>
    <div id="livepill" class="down"><span class="dot"></span><span id="pill-state">connecting</span><span class="sep">-</span><span id="pill-agent">—</span><span class="sep">-</span><span class="act" id="pill-act">—</span></div>
    <div class="right" id="tb-right"><span class="ro">read-only</span><span class="vsep"></span><span class="clock" id="clock">00:00:00</span></div>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
