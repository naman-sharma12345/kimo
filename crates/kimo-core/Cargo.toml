[package]
name = "kimo-core"
version.workspace = true
edition.workspace = true

[dependencies]
ab_glyph = "0.2.32"
serde = { version = "1", features = ["derive","rc"] }
serde_json = "1"
roxmltree = "0.21"

tiff = "0.10"

exr = "1.74"

gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"], optional = true }
tobj = { version = "=4.0.5", default-features = false, optional = true }
bvh = { version = "=0.13.0", default-features = false, features = ["std"], optional = true }
nalgebra = { version = "=0.35.0", optional = true }
isosurface = { version = "=0.1.0-alpha.0", optional = true }
mikktspace = { version = "=0.3.0", default-features = false, features = ["glam"], optional = true }

# Procedural mesh unit (approved 2026-10-15): opensubdiv-rs MIT. csgrs dropped per owner decision (option B) - in-house CSG later.
opensubdiv-rs = { version = "=0.1.3" }

# v6 eyes audio_spectrum (2026-10-17): rustfft 6.4.1, MIT OR Apache-2.0.
rustfft = "=6.4.1"

[features]
default = ["surface-contour"]
native-ocio = []
mesh-import = ["dep:gltf", "dep:tobj"]
gpu3d = ["dep:wgpu"]
# v7 GPU/2D pipeline (opt-in, default off): WGSL compute kernels for a couple of 2D effects (gaussian blur, color
# matrix) run through wgpu on whatever adapter is present (lavapipe software Vulkan on this box). Independent of
# gpu3d (which is the 3D mesh/offscreen-raster path) so a 2D-only build does not need mesh-import/flat-sah etc.
# The CPU path (gpu2d::cpu_*) stays the implementation every existing effect and golden uses; this feature adds
# a parallel, separately-tested GPU path that nothing calls by default.
gpu2d = ["dep:wgpu"]
flat-sah = ["dep:bvh", "dep:nalgebra"]
surface-contour = ["dep:isosurface"]
material-textures = ["dep:mikktspace"]

[dev-dependencies]
criterion = "=0.5.1"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"], optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12"], optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"], optional = true }

[[bench]]
name = "flat_sah"
harness = false
required-features = ["flat-sah", "mesh-import"]
