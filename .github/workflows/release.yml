name: release

# Builds every downloadable artifact and, on a v* tag, attaches them to a DRAFT
# GitHub release. Nothing is ever published by this workflow: a maintainer reviews
# the draft and clicks "Publish" by hand.
#
#   push tag v*         -> build everything, SHA256SUMS, create/update a DRAFT release
#   workflow_dispatch   -> dry run: build everything, upload workflow artifacts and
#                          SHA256SUMS, no release (unless run on a v* tag with
#                          draft_release ticked)
#
# In-app updates (docs/UPDATES_AND_CRASH_REPORTS.md): when the repository has the updater signing key, the app
# installers are signed for the Tauri updater (`<installer>.sig`) and the `updater` job writes `latest.json`, which the
# app reads from https://github.com/<repo>/releases/latest/download/latest.json. Only a PUBLISHED release is "latest",
# so publishing the draft is what ships an update. Needed (Settings > Secrets and variables > Actions):
#   secret   TAURI_SIGNING_PRIVATE_KEY           the private key from `tauri signer generate` (its file content)
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if generated without one)
#   variable TAURI_UPDATER_PUBKEY                the matching public key (the .pub file content), built into the app
# Without them the installers are built exactly as before, with no updater files (dry runs need no secrets).
# Windows Authenticode code signing is NOT done yet (TODO, needs a code-signing certificate): see the gui job.
# No other secrets or certificates, GitHub-hosted runners only.
# Every third-party action is pinned to a full commit SHA (tag in the comment).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "When run on a v* tag: also attach the artifacts to a DRAFT release (never published). Off = dry run, workflow artifacts only."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  TAURI_CLI_VERSION: "2.12.3"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-22.04   # old glibc baseline for the gnu build
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc build (needs glibc >= 2.35). The static musl build was dropped for this release
          # (owner decision 2026-10-17): the vendored Manifold C++ build has no musl C++ compiler on the runner.
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64-glibc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          rustc -V

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build (default features, no OCIO)
        run: cargo build --release --locked -p kimo-mcp --target ${{ matrix.target }}

      - name: Fetch bundled fonts (SIL OFL)
        run: |
          bash fonts/fetch.sh
          n=$(find fonts -maxdepth 1 -name '*.ttf' -size +10k | wc -l)
          echo "fonts: $n"
          # fetch.sh swallows download errors, so fail on a short or empty set
          test "$n" -ge 70
          find fonts -maxdepth 1 -name '*.ttf' -size -10k -print -quit | grep -q . && { echo "truncated font"; exit 1; } || true

      - name: Smoke test the built binary
        run: |
          bin=target/${{ matrix.target }}/release/kimo-mcp
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | KIMO_FONTS=$PWD/fonts "$bin")
          echo "$out" | head -1 | grep -q '"serverInfo"'
          echo "$out" | tail -1 | python3 -c 'import sys,json; n=len(json.loads(sys.stdin.read())["result"]["tools"]); print("tools:",n); assert n>=16'

      - name: Package
        id: pkg
        run: |
          ver="${GITHUB_REF_NAME//\//-}"
          name="kimo-${ver}-${{ matrix.suffix }}"
          mkdir -p "dist/$name/bin" "dist/$name/fonts"
          install -m755 target/${{ matrix.target }}/release/kimo-mcp "dist/$name/bin/kimo-mcp"
          strip "dist/$name/bin/kimo-mcp" || true
          cp fonts/*.ttf fonts/fetch.sh "dist/$name/fonts/"
          cp README.md FEATURES.md "dist/$name/" 
          cp docs/RELEASE_BINARIES.md "dist/$name/"
          (cd dist && tar -czf "$name.tar.gz" "$name" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz
            dist/${{ steps.pkg.outputs.name }}.tar.gz.sha256

  windows:
    name: build (windows-x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: windows-x86_64-v2-${{ hashFiles('Cargo.lock') }}
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and package Windows
        shell: pwsh
        run: |
          # Tag builds take the version from the tag (v3.0.0 -> 3.0.0); other runs use Cargo.toml.
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          else { $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value }
          ./packaging/windows/build.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimo-windows-x86_64
          path: dist/*
          if-no-files-found: error

  # THE kimo app (crates/kimo-gui): what people download from GitHub releases and getkimo.tech. One installer with the
  # engine (kimo-mcp) inside as a Tauri sidecar and the bundled fonts as resources. It is its own Cargo workspace, so
  # the engine is built from the root workspace first and staged as binaries/kimo-mcp-<target-triple>.
  # Stable file names for the website's download buttons:
  #   kimo-setup-windows-x64.exe   kimo-linux-x86_64.AppImage   kimo-linux-amd64.deb
  gui:
    name: kimo app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      # updater signing (optional, see the header). `tauri build` signs the updater artifacts with this key.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
          - os: windows-latest
            label: windows-x86_64
            triple: x86_64-pc-windows-msvc
            bundles: "nsis"
          # macOS: no build for this release (owner decision 2026-10-17); coming later.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system packages (WebKitGTK 4.1, libsoup 3, AppImage tooling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file ffmpeg

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/kimo-gui/target
          key: app-${{ matrix.label }}-${{ hashFiles('Cargo.lock', 'crates/kimo-gui/Cargo.toml') }}
          restore-keys: app-${{ matrix.label }}-

      - name: Clear stale installer bundles from the cache
        shell: bash
        run: find crates/kimo-gui/target -type d -path '*/release/bundle' -prune -print -exec rm -rf {} + || true

      - name: Engine (kimo-mcp) as the app's sidecar
        shell: bash
        run: |
          cargo build --release -p kimo-mcp --bin kimo-mcp
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p crates/kimo-gui/binaries
          cp "target/release/kimo-mcp$ext" "crates/kimo-gui/binaries/kimo-mcp-${{ matrix.triple }}$ext"
          ls -l crates/kimo-gui/binaries

      - name: Fonts (SIL OFL), shipped as resources/fonts
        shell: bash
        run: |
          bash fonts/fetch.sh
          test "$(find fonts -maxdepth 1 -name '*.ttf' -size +10k | wc -l)" -ge 70

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the Tauri CLI (exact version)
        shell: bash
        run: |
          npm install -g "@tauri-apps/cli@${TAURI_CLI_VERSION}"
          tauri --version

      - name: Bundle config (version from the tag, engine sidecar, fonts, updater key)
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then export KIMO_VERSION="$v"; fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            export KIMO_UPDATER=1
            echo "updater: ON (installers signed for in-app updates)"
          else
            echo "::warning::Updater signing key or public key not set: this build has no in-app updates (see docs/UPDATES_AND_CRASH_REPORTS.md)"
          fi
          node -e '
            const c = { bundle: { externalBin: ["binaries/kimo-mcp"], resources: { "../../fonts/": "fonts/" } } };
            if (process.env.KIMO_VERSION) c.version = process.env.KIMO_VERSION;
            if (process.env.KIMO_UPDATER) {
              c.bundle.createUpdaterArtifacts = true;                       // writes <installer>.sig next to each installer
              c.plugins = { updater: { pubkey: process.env.UPDATER_PUBKEY.trim() } };
            }
            require("fs").writeFileSync("crates/kimo-gui/tauri.release.json", JSON.stringify(c, null, 1) + "\n");
          '
          cat crates/kimo-gui/tauri.release.json

      # TODO(windows-signing): Authenticode-sign kimo-setup-windows-x64.exe (and kimo-gui.exe / kimo-mcp.exe inside it)
      # so SmartScreen stops warning. Needs a code-signing certificate (OV/EV, or Azure Trusted Signing). Then set
      # bundle.windows.signCommand (or certificateThumbprint + timestampUrl) in tauri.release.json above, with the
      # certificate from repository secrets. The updater signature (.sig) is separate and already handled.

      - name: Build the installers
        working-directory: crates/kimo-gui
        shell: bash
        run: tauri build --bundles ${{ matrix.bundles }} --config tauri.release.json

      - name: Collect installers under stable names
        shell: bash
        run: |
          mkdir -p dist
          b=crates/kimo-gui/target/release/bundle
          # each installer and, when the updater is on, its updater signature under the same stable name + .sig
          # (NSIS and AppImage signatures are required; a .deb signature depends on the Tauri CLI version, so it is optional)
          KIMO_UPDATER=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then KIMO_UPDATER=1; fi
          take() {
            cp "$1" "dist/$2"
            if [ -z "$KIMO_UPDATER" ]; then return 0; fi
            if [ -s "$1.sig" ]; then cp "$1.sig" "dist/$2.sig"
            elif [ "${3:-}" = optional ]; then echo "::warning::no updater signature for $2: that package will not update in-app"
            else echo "missing updater signature $1.sig"; exit 1; fi
          }
          case "$RUNNER_OS" in
            Windows) take "$(ls $b/nsis/*-setup.exe | head -1)" kimo-setup-windows-x64.exe ;;
            Linux)   take "$(ls $b/appimage/*.AppImage | head -1)" kimo-linux-x86_64.AppImage
                     take "$(ls $b/deb/*.deb | head -1)" kimo-linux-amd64.deb optional ;;
          esac
          ls -l dist

      - name: Agent attach check script
        shell: bash
        run: |
          cat > attach_check.py <<'PY'
          import json, subprocess, sys
          p = subprocess.Popen([sys.argv[1], "mcp", "--client", "ci"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def rq(i, m, params):
              p.stdin.write(json.dumps({"jsonrpc": "2.0", "id": i, "method": m, "params": params}) + "\n"); p.stdin.flush()
              while True:
                  v = json.loads(p.stdout.readline())
                  if v.get("id") == i: return v
          init = rq(1, "initialize", {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}})
          assert "open on this computer" in init["result"]["instructions"], "attached to a standalone engine, not the app"
          r = rq(2, "tools/call", {"name": "timeline", "arguments": {"action": "add_track", "args": {}}})
          assert "track" in r["result"]["content"][0]["text"], r
          print("an agent attached to the running app:", init["result"]["serverInfo"], r["result"]["content"][0]["text"])
          p.stdin.close()
          PY

      - name: Windows smoke test (silent install, engine starts, an agent attaches, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\kimo-setup-windows-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\kimo", "$env:LOCALAPPDATA\Programs\kimo" -Filter kimo-gui.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed kimo-gui.exe not found" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'kimo-mcp.exe'))) { throw "engine sidecar kimo-mcp.exe not installed next to the app" }
          Write-Output "installed: $($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          $bridge = "$env:APPDATA\dev.kimo.app\bridge.json"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $bridge); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $bridge)) { throw "the app did not open its bridge" }
          Start-Sleep -Seconds 4
          if (-not (Get-Process kimo-mcp -ErrorAction SilentlyContinue)) { throw "the engine sidecar did not start" }
          python attach_check.py $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "an agent could not attach to the running app" }
          Stop-Process -Id $app.Id -Force
          Get-Process kimo-mcp -ErrorAction SilentlyContinue | Stop-Process -Force
          $un = Get-ChildItem $exe.DirectoryName -Filter 'uninstall*.exe' | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList '/S' -Wait }

      - name: Linux smoke test (deb install, headless launch, engine starts, an agent attaches, uninstall)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb ./dist/kimo-linux-amd64.deb
          pkg=$(dpkg-deb --field dist/kimo-linux-amd64.deb Package)
          bin=$(dpkg -L "$pkg" | grep -m1 '/usr/bin/kimo-gui$')
          test -x /usr/bin/kimo-mcp
          xvfb-run -a "$bin" > app.log 2>&1 &
          bridge="$HOME/.local/share/dev.kimo.app/bridge.json"
          for _ in $(seq 1 60); do [ -f "$bridge" ] && break; sleep 0.5; done
          test -f "$bridge" || { cat app.log; exit 1; }
          sleep 4
          pgrep -f kimo-mcp
          python3 attach_check.py "$bin"
          pkill -f "$bin" || true
          sudo dpkg -r "$pkg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimo-app-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # The updater manifest the app reads (releases/latest/download/latest.json): version, notes, and per platform the
  # download URL (the stable asset names on this tag's release) and the updater signature. Skipped (no file) when the
  # installers were built without the signing key.
  updater:
    name: updater manifest (latest.json)
    needs: [gui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kimo-app-*
          path: app
          merge-multiple: true
      - name: Write latest.json
        id: manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l app
          python3 - <<'PY'
          import datetime, json, os, re, sys
          app = "app"
          ref, ref_type = os.environ["GITHUB_REF_NAME"], os.environ["GITHUB_REF_TYPE"]
          if ref_type == "tag" and re.fullmatch(r"v\d+\.\d+\.\d+", ref):
              version, tag = ref[1:], ref
          else:  # dry run: the version the app was built with; the URLs point at a tag that may not exist yet
              version = json.load(open("crates/kimo-gui/tauri.conf.json"))["version"]; tag = "v" + version
          def sig(name):
              p = os.path.join(app, name + ".sig")
              return open(p).read().strip() if os.path.isfile(p) and os.path.getsize(p) > 0 else None
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/"
          files = {  # updater key -> stable asset name; {os}-{arch}-{bundle} is looked up first, then {os}-{arch}
              "windows-x86_64-nsis": "kimo-setup-windows-x64.exe",
              "windows-x86_64": "kimo-setup-windows-x64.exe",
              "linux-x86_64-appimage": "kimo-linux-x86_64.AppImage",
              "linux-x86_64": "kimo-linux-x86_64.AppImage",
              "linux-x86_64-deb": "kimo-linux-amd64.deb",
          }
          platforms = {}
          for key, name in files.items():
              s = sig(name)
              if s and os.path.isfile(os.path.join(app, name)):
                  platforms[key] = {"signature": s, "url": base + name}
          if not platforms:
              print("::notice::no updater signatures (signing key not configured): no latest.json")
              open(os.environ["GITHUB_OUTPUT"], "a").write("made=false\n"); sys.exit(0)
          missing = [k for k in ("windows-x86_64", "linux-x86_64") if k not in platforms]
          if missing: sys.exit(f"updater signatures missing for {missing}: refusing a manifest that strands those installs")
          m = {"version": version,
               "notes": f"kimo {version}. Release notes: https://github.com/{os.environ['REPO']}/releases/tag/{tag}",
               "pub_date": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
               "platforms": platforms}
          os.makedirs("out", exist_ok=True)
          json.dump(m, open("out/latest.json", "w"), indent=2)
          print(json.dumps(m, indent=2))
          open(os.environ["GITHUB_OUTPUT"], "a").write("made=true\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.manifest.outputs.made == 'true'
        with:
          name: kimo-updater-manifest
          path: out/latest.json
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [build, windows, gui, updater]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          cd artifacts
          ls -l
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort > ../files.txt
          test -s ../files.txt
          xargs -d '\n' sha256sum -- < ../files.txt > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    name: draft release (never published)
    needs: [build, windows, gui, updater, checksums]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
          && (github.event_name == 'push' || inputs.draft_release)
          && needs.build.result == 'success' && needs.windows.result == 'success'
          && needs.gui.result == 'success' && needs.updater.result == 'success'
          && needs.checksums.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ls -l artifacts
          cat > notes.md <<'NOTES'
          ## Download kimo

          | System | File |
          |---|---|
          | Windows 10/11 (64-bit) | **kimo-setup-windows-x64.exe** |
          | Linux (x86_64) | **kimo-linux-x86_64.AppImage** or **kimo-linux-amd64.deb** |

          kimo is the desktop app: a video editor with the kimo engine inside. Use it with Claude Code, Codex or
          Antigravity on the plan you already have (no API key needed), and watch every edit land on the timeline live.
          The other files are the engine on its own, for people who only want the MCP server.

          DRAFT. Not yet code-signed on Windows; macOS is coming later. Windows: SmartScreen > More info > Run anyway.
          Verify downloads against SHA256SUMS. Installed copies of kimo offer this update in-app once the release is
          published (latest.json; the .sig files are the updater signatures).
          NOTES
          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Release $tag is already published. This workflow only touches drafts; refusing to change it."
              exit 1
            fi
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --draft --verify-tag --title "kimo $tag" --notes-file notes.md
          fi
          test "$(gh release view "$tag" --json isDraft -q .isDraft)" = true
