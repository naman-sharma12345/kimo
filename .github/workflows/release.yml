name: release-binaries
# Builds kimo-mcp for Linux, macOS (arm64 and x86_64) and Windows and attaches them to a release when a v* tag is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        default: v1.0.0
env:
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, name: linux-x86_64, exe: kimo-mcp }
          - { os: macos-14,       target: aarch64-apple-darwin,      name: macos-arm64,  exe: kimo-mcp }
          - { os: macos-13,       target: x86_64-apple-darwin,       name: macos-x86_64, exe: kimo-mcp }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x86_64, exe: kimo-mcp.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: smoke test (MCP initialize)
        shell: bash
        run: echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | target/${{ matrix.target }}/release/${{ matrix.exe }} | head -c 200
      - name: package
        shell: bash
        run: |
          D=kimo-${{ env.TAG }}-${{ matrix.name }}
          mkdir $D && cp target/${{ matrix.target }}/release/${{ matrix.exe }} README.md $D/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a $D.zip $D; else tar czf $D.tar.gz $D; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            kimo-*.tar.gz
            kimo-*.zip
