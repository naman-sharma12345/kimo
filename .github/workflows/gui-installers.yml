# DRAFT, manual only: builds the kimo app installers (the GUI is the main app; the engine rides inside as a sidecar).
# Nothing here runs on push or tag. Artifacts are uploaded to the run only; publishing to a release is a separate,
# deliberate step a maintainer does by hand after checking them.
name: gui-installers (draft, manual)

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "git ref to build kimo-mcp from"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.engine_ref || github.ref }}" }
      - name: System packages (WebKitGTK 4.1, libsoup 3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xz-utils
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine (kimo-mcp)
        run: cargo build --release -p kimo-mcp --bin kimo-mcp
      - name: Fonts (SIL OFL)
        run: |
          bash fonts/fetch.sh
          test "$(find fonts -maxdepth 1 -name '*.ttf' -size +10k | wc -l)" -ge 70
      - name: GUI (smallest profile, embedded UI)
        working-directory: crates/kimo-gui
        run: cargo build --profile dist --features custom-protocol
      - name: Unit + real-engine tests
        working-directory: crates/kimo-gui
        env: { KIMO_MCP_BIN: "${{ github.workspace }}/target/release/kimo-mcp" }
        run: cargo test --release --lib
      - name: Package (tar.xz + SHA-512 + online setup script)
        run: |
          sh crates/kimo-gui/installer/linux/make-package.sh crates/kimo-gui/target/dist/kimo-gui target/release/kimo-mcp fonts out
          sh crates/kimo-gui/installer/linux/test-setup.sh out
      - uses: actions/upload-artifact@v4
        with: { name: kimo-linux-x86_64, path: out/ }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.engine_ref || github.ref }}" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine (kimo-mcp.exe) as the Tauri sidecar
        shell: pwsh
        run: |
          cargo build --release -p kimo-mcp --bin kimo-mcp
          New-Item -ItemType Directory -Force crates/kimo-gui/binaries | Out-Null
          Copy-Item target/release/kimo-mcp.exe crates/kimo-gui/binaries/kimo-mcp-x86_64-pc-windows-msvc.exe
      - name: Fonts (SIL OFL), shipped as resources/fonts
        shell: bash
        run: |
          bash fonts/fetch.sh
          test "$(find fonts -maxdepth 1 -name '*.ttf' -size +10k | wc -l)" -ge 70
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Branded NSIS installer (WebView2 via the bootstrapper, per-user, LZMA)
        working-directory: crates/kimo-gui
        shell: bash
        run: cargo tauri build --bundles nsis --config '{"bundle":{"externalBin":["binaries/kimo-mcp"],"resources":{"../../fonts/":"fonts/"}}}'
        # externalBin is set here, not in tauri.conf.json, so release.yml's existing spectator job (which stages no
        # sidecar) keeps building unchanged.
      - name: Sizes
        shell: pwsh
        run: Get-ChildItem -Recurse crates/kimo-gui/target/release/bundle/nsis | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: kimo-windows-x86_64, path: crates/kimo-gui/target/release/bundle/nsis/*.exe }
