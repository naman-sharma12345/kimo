[workspace]
resolver = "2"
members = ["crates/kimo-core", "crates/kimo-mcp", "crates/kimo-cli"]

[workspace.package]
version = "7.4.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

# Gate profile (V3-1b): same code generation as release minus the cost that is not needed to run proofs: no LTO, no debuginfo, parallel codegen units.
# Used by tests/gate_fast.sh and tests/gate_full.sh (cargo test --profile gate). Release stays the shipping profile.
[profile.gate]
inherits = "release"
lto = false
debug = 0
codegen-units = 16
incremental = true
